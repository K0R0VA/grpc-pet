syntax = "proto3";
package tracking; 

service TrackingService {
  rpc AddAlert (AlertRequest) returns (AlertResponse);
  rpc SetSubscription(SubscriptionRequest) returns (SubscriptionResponse);
  rpc WatchPrices (RouteRequest) returns (stream PriceUpdate);
}

message AlertRequest {
  int32 user_id = 1;
  int32 route = 2;      
  float target_price = 3; 
}

message AlertResponse {
  bool success = 1;
  int32 alert_id = 2;
}

message PriceUpdate {
  int32 route_id = 1;
  string route = 2;
  float current_price = 3;
}

message RouteRequest {}

message SubscriptionRequest {
  int32 user_id = 1;
  int32 subscription_type = 2;
  bool enabled = 3;
}

message SubscriptionResponse {}