syntax = "proto3";
package tracking; 

service TrackingService {
  rpc AddAlert (AlertRequest) returns (AlertResponse);
  rpc WatchPrices (RouteRequest) returns (stream PriceUpdate);
}

message AlertRequest {
  int32 user_id = 1;
  int32 route = 2;      
  float target_price = 3; 
}

message AlertResponse {
  bool success = 1;
  int32 alert_id = 2;
}

message PriceUpdate {
  string route = 1;
  float current_price = 2;
}

message RouteRequest {
  int32 route_id = 1;
}